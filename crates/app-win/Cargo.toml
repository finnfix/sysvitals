[package]
name = "app-win"
description = "Windows display layer: topmost taskbar overlay indicator (Win32 layered window + GDI text) plus tray/settings host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Windows-only. Build explicitly with `cargo build -p app-win` on a Windows
# MSVC host (or via CI). The `windows` dependency is target-gated so the
# workspace still resolves on Linux/macOS.

[dependencies]
sysvitals-core = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[[bin]]
name = "sysvitals"
path = "src/main.rs"
