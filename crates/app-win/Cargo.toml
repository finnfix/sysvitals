[package]
name = "app-win"
description = "Windows display layer: taskbar-embedded indicator (Win32 + Direct2D/DirectWrite) plus tray/settings host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Windows-only. Build explicitly with `cargo build -p app-win` on a Windows
# MSVC host. `windows`/`windows-sys`, GPUI and
# gpui-tray deps land with the display layer so the workspace resolves on Linux/macOS.

[[bin]]
name = "sysvitals"
path = "src/main.rs"
