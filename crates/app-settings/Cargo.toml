[package]
name = "app-settings"
description = "GPUI-based settings window for SysVitals, launched by the platform overlay."
version.workspace = true
edition = "2024"
rust-version = "1.85"
license.workspace = true
repository.workspace = true
publish.workspace = true

# Platform-specific: requires a desktop GPU context. Built explicitly with
# `cargo build -p app-settings` on Windows/macOS (or via CI). Kept out of
# default-members so headless hosts (Linux CI test job) skip it.

[dependencies]
sysvitals-core = { workspace = true }
gpui-kit = { workspace = true }

# Windows-only: the settings window reads the same registry flag as the
# overlay (HKCU Explorer\Advanced\TaskbarAl) to decide whether to offer the
# taskbar anchor choices.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winres = "=0.1.12"

[[bin]]
name = "SysVitalsSettings"
path = "src/main.rs"
