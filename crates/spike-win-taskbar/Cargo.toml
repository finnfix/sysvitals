[package]
name = "spike-win-taskbar"
description = "Minimal Win32 taskbar-embedding spike (throwaway risk gate); deleted after acceptance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Windows-only. Not in default-members; build explicitly with
# `cargo build -p spike-win-taskbar` on a Windows MSVC host. The `windows`
# dependency is target-gated so the workspace still resolves on Linux/macOS.

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[[bin]]
name = "spike-win-taskbar"
path = "src/main.rs"
