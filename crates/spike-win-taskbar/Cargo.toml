[package]
name = "spike-win-taskbar"
description = "Minimal Win32 taskbar-embedding spike (throwaway risk gate); deleted after acceptance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Windows-only. Not in default-members; build explicitly with
# `cargo build -p spike-win-taskbar` on a Windows MSVC host. `windows`/`windows-sys`
# deps are added when the spike is implemented so the workspace still
# resolves on Linux/macOS.

[[bin]]
name = "spike-win-taskbar"
path = "src/main.rs"
