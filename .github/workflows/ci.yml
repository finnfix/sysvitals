name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (default members)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      # Platform-crate compile gate: each platform crate is built only on its
      # own OS runner (MSVC on windows-latest, Xcode on macos-latest). This
      # catches build breakage of the display layers without needing a local
      # toolchain.
      - name: Build Windows display layer
        if: matrix.os == 'windows-latest'
        run: cargo build --release -p app-win
      # GPUI settings window: required build gate on Windows.
      - name: Build GPUI settings window
        if: matrix.os == 'windows-latest'
        run: cargo build --release -p app-settings
      # Portable (green) distribution: overlay exe (+ settings exe if built).
      # Package name: SysVitals-{platform}-{arch}-{version}.zip; the version
      # is read from the workspace Cargo.toml (single source of truth).
      - name: Package Windows portable zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $zip = "SysVitals-windows-x64-$version.zip"
          $files = @("target/release/SysVitals.exe")
          if (Test-Path "target/release/SysVitalsSettings.exe") { $files += "target/release/SysVitalsSettings.exe" }
          Compress-Archive -Path $files -DestinationPath $zip
          Write-Host "Packaged $zip"
      - name: Upload Windows portable package
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: SysVitals-windows-x64
          path: SysVitals-windows-x64-*.zip
          if-no-files-found: error
      - name: Build macOS display layer
        if: matrix.os == 'macos-latest'
        run: cargo build --release -p app-mac
