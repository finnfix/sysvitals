name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (default members)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      # Platform-crate compile gate: each platform crate is built only on its
      # own OS runner (MSVC on windows-latest, Xcode on macos-latest). This
      # catches build breakage of the display layers without needing a local
      # toolchain.
      - name: Build Windows display layer
        if: matrix.os == 'windows-latest'
        run: cargo build --release -p app-win
      # GPUI settings window: required build gate on Windows.
      - name: Build GPUI settings window
        if: matrix.os == 'windows-latest'
        run: cargo build --release -p app-settings
      # Portable (green) distribution: overlay exe (+ settings exe if built).
      # Package name: SysVitals-{platform}-{arch}-{version}.zip; the version
      # is read from the workspace Cargo.toml (single source of truth).
      - name: Package Windows portable zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $zip = "SysVitals-windows-x64-$version.zip"
          $files = @("target/release/SysVitals.exe")
          if (Test-Path "target/release/SysVitalsSettings.exe") { $files += "target/release/SysVitalsSettings.exe" }
          Compress-Archive -Path $files -DestinationPath $zip
          Write-Host "Packaged $zip"
      - name: Upload Windows portable package
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: SysVitals-windows-x64
          path: SysVitals-windows-x64-*.zip
          if-no-files-found: error
      - name: Build macOS display layer
        if: matrix.os == 'macos-latest'
        run: cargo build --release -p app-mac
      # GPUI settings window is cross-platform; build it on macOS too.
      - name: Build GPUI settings window (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo build --release -p app-settings
      # macOS .app bundle: assemble the bundle structure (binary + Info.plist +
      # AppIcon.icns), then zip it. Package name: SysVitals-macos-{arch}-{version}.zip.
      - name: Package macOS app bundle
        if: matrix.os == 'macos-latest'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          arch=$(uname -m)
          app="SysVitals.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/sysvitals "$app/Contents/MacOS/sysvitals"
          if [ -f target/release/SysVitalsSettings ]; then
            cp target/release/SysVitalsSettings "$app/Contents/MacOS/SysVitalsSettings"
          fi
          cp crates/app-mac/assets/Info.plist "$app/Contents/Info.plist"
          cp crates/app-mac/assets/AppIcon.icns "$app/Contents/Resources/AppIcon.icns"
          zip -qr "SysVitals-macos-$arch-$version.zip" "$app"
          echo "Packaged SysVitals-macos-$arch-$version.zip"
      - name: Upload macOS app bundle
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: SysVitals-macos
          path: SysVitals-macos-*.zip
          if-no-files-found: error
