name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (default members)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      # Platform-crate compile gate: each platform crate is built only on its
      # own OS runner (MSVC on windows-latest, Xcode on macos-latest). This
      # catches build breakage of the display layers without needing a local
      # toolchain.
      - name: Build Windows display layer
        if: matrix.os == 'windows-latest'
        run: cargo build --release -p app-win
      - name: Upload Windows indicator binary
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sysvitals-windows
          path: target/release/sysvitals.exe
          if-no-files-found: error
      - name: Build macOS display layer
        if: matrix.os == 'macos-latest'
        run: cargo build --release -p app-mac
