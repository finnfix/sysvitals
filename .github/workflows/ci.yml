name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Quality gate: the only job that lints and tests.
  #
  # The shared sampling/formatting/config layer is platform-independent, so it
  # is checked on Linux, the cheapest runner. `cargo fmt` at a workspace root
  # covers every member, so all crates are style-checked here even though the
  # platform crates are not buildable on Linux; `cargo clippy` and `cargo test`
  # act on the workspace's default members (the cross-platform crates), which
  # is what they already did on every runner before this split.
  # ---------------------------------------------------------------------------
  quality:
    name: Quality (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check (all workspace members)
        run: cargo fmt --check
      - name: Clippy (default members)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (default members)
        run: cargo test

  # ---------------------------------------------------------------------------
  # Build gate + distribution packaging.
  #
  # Each platform crate can only compile with its own OS toolchain (MSVC on
  # windows-latest, Xcode on macos-latest), so these runners exist to prove the
  # display layers still build and to produce the shippable archives. They do
  # not repeat the quality checks: the logic they depend on is already covered
  # by the quality job.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build & package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows display layer
        run: cargo build --release -p app-win
      - name: Build GPUI settings window
        run: cargo build --release -p app-settings
      - name: Build GPUI history chart
        run: cargo build --release -p app-history
      # Portable (green) distribution: overlay exe plus the settings/history
      # exes when present. Package name: SysVitals_Windows_x64_{version}_dev.zip
      # (Windows ships x64 only); the version is read from the workspace
      # Cargo.toml (single source of truth). The `_dev` suffix marks a
      # development-phase build: these artifacts are not releases, and the
      # suffix is dropped when the first tagged version is published.
      - name: Package Windows portable zip
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $zip = "SysVitals_Windows_x64_${version}_dev.zip"
          $files = @("target/release/SysVitals.exe")
          if (Test-Path "target/release/SysVitalsSettings.exe") { $files += "target/release/SysVitalsSettings.exe" }
          if (Test-Path "target/release/SysVitalsHistory.exe") { $files += "target/release/SysVitalsHistory.exe" }
          Compress-Archive -Path $files -DestinationPath $zip
          Write-Host "Packaged $zip"
      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: SysVitals-windows-x64
          path: SysVitals_Windows_x64_*.zip
          if-no-files-found: error

  build-macos:
    name: Build & package (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Apple Silicon only: the explicit target pin keeps the package arm64
      # no matter which arch the runner image happens to be.
      - name: Build macOS display layer
        run: cargo build --release --target aarch64-apple-darwin -p app-mac
      - name: Build GPUI settings window
        run: cargo build --release --target aarch64-apple-darwin -p app-settings
      - name: Build GPUI history chart
        run: cargo build --release --target aarch64-apple-darwin -p app-history
      # One bundle, not three apps: the indicator is the declared
      # CFBundleExecutable, and the settings/history binaries are sibling
      # executables it launches from Contents/MacOS. Package name:
      # SysVitals_macOS_arm64_{version}_dev.zip (macOS ships Apple Silicon
      # only). The `_dev` suffix marks a development-phase build and is
      # dropped at the first tagged release (mirrors the Windows step).
      - name: Package macOS app bundle
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          app="SysVitals.app"
          bin="target/aarch64-apple-darwin/release"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "$bin/sysvitals" "$app/Contents/MacOS/sysvitals"
          if [ -f "$bin/SysVitalsSettings" ]; then
            cp "$bin/SysVitalsSettings" "$app/Contents/MacOS/SysVitalsSettings"
          fi
          if [ -f "$bin/SysVitalsHistory" ]; then
            cp "$bin/SysVitalsHistory" "$app/Contents/MacOS/SysVitalsHistory"
          fi
          cp crates/app-mac/assets/Info.plist "$app/Contents/Info.plist"
          cp crates/app-mac/assets/AppIcon.icns "$app/Contents/Resources/AppIcon.icns"
          zip -qr "SysVitals_macOS_arm64_${version}_dev.zip" "$app"
          echo "Packaged SysVitals_macOS_arm64_${version}_dev.zip"
      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: SysVitals-macos-arm64
          path: SysVitals_macOS_arm64_*.zip
          if-no-files-found: error
